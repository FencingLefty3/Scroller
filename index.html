<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Feed</title>
    <style>
        html, body {
            font-size: 62.5%; 
            font-family: Roboto, Arial, sans-serif;
            background-color: #0f0f0f;
            padding-top: 5svh;
            
        }

        html {
            scroll-snap-type: y mandatory;
        }

        body {
            width: 100%;
            align-items: center;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
        }

        .card {
            border-radius: 15px;
            aspect-ratio: 9/16;
            height: 90svh;
            max-width: 56.25svh;
            background-color: white;
            margin: 5svh auto;
            overflow: hidden;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .card img {
            display: block;
            height: 100%;
            object-fit: cover;
            width: 100%;
        }

        .loader,
        .loader:before,
        .loader:after {
        border-radius: 50%;
        width: 2.5em;
        height: 2.5em;
        animation-fill-mode: both;
        animation: bblFadInOut 1.8s infinite ease-in-out;
        }
        .loader {
        --color-1: #fff;
        --size: 1px;

        color: var(--color-1);
        font-size: calc(7 * var(--size));
        position: relative;
        text-indent: -9999em;
        transform: translateZ(0);
        animation-delay: -0.16s;
        }
        .loader:before,
        .loader:after {
        content: '';
        position: absolute;
        top: 0;
        }
        .loader:before {
        left: -3.5em;
        animation-delay: -0.32s;
        }
        .loader:after {
        left: 3.5em;
        }

        @keyframes bblFadInOut {
        0%,
        80%,
        100% {
            box-shadow: 0 2.5em 0 -1.3em;
        }
        40% {
            box-shadow: 0 2.5em 0 0;
        }
        }
    </style>
</head>
<body>
    <main id="Feed">
        <div class="card">
            <img src="https://www.picsum.photos/seed/1/900/1600" alt="Random Image"> 
        </div>
        <div class="card">
            <img src="https://picsum.photos/seed/2/900/1600" alt="Random Image2"> 
        </div>
    </main>
    
    
    <span class="loader" id="loadMore"></span>
<script>
    const randomColor = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');

    const feed = document.getElementById("Feed")
    const loadMore = document.getElementById("loadMore")

    let cardNumber = 2

    function generateCard() {
        cardNumber += 1

        const numb = Math.round(Math.random())

        const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="card">
            <img src="https://picsum.photos/seed/${cardNumber}/900/1600" alt="Random Image2"> 
        </div>`;
        feed.appendChild(card);
    }
    generateCard()
    
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) generateCard();
    }, { rootMargin: '400px' });

    observer.observe(loadMore);

</script>
</body>
</html>
